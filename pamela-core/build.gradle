repositories {
    mavenCentral()
    maven { url 'https://maven.openflexo.org/artifactory/openflexo-deps' }
}

dependencies {
  api flexoUtils()
  api connieJava()
  api group: 'org.jdom', name: 'jdom2', version: '2.0.6.1'
  api group: 'org.javassist', name: 'javassist', version: '3.30.2-GA'
 // Lots of test errors when using 3.30.2
 // Error when using 3.23 (see below)

  // RabbitMQ for collaborative synchronization
  api group: 'com.rabbitmq', name: 'amqp-client', version: '5.20.0'
  
  // Jackson for JSON serialization of sync operations
  api group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.16.0'
  api group: 'org.apache.activemq', name: 'artemis-server', version: '2.33.0'
  api group: 'org.eclipse.paho', name: 'org.eclipse.paho.client.mqttv3', version: '1.2.5'
  
  
  implementation 'org.apache.activemq:artemis-mqtt-protocol:2.33.0'
  implementation 'org.apache.activemq:artemis-core-client:2.33.0'
  implementation 'org.apache.activemq:artemis-server:2.33.0'

  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
  testImplementation 'org.mockito:mockito-core:5.11.0'
  // testImplementation 'org.mockito:mockito-inline:5.11.0'
  testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

  implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

}

test {
  useJUnitPlatform()
  finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
    }
}

